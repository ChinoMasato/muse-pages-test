// map: G=grass g=grass2 D=dirt S=stone W=water
const MAP=["GGGGGGGGGGGG","GgGGDDGGGGGGGG".slice(0,12),"GGGDDDGGSSGGGG".slice(0,12),"GGGGDDGGSSGGGG".slice(0,12),"GGGGDDGGGGWWGG".slice(0,12),"GgGGDDGGGGWWGG".slice(0,12),"GGGGGGGGGGGGGG".slice(0,12),"GGGGGGGGGGGGGG".slice(0,12)];
const T={G:'grass',g:'grass2',D:'dirt',S:'stone',W:'water'};
const cv=document.getElementById('g'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
let loaded=0;const keys={};
for(const k in SRC){const i=new Image();i.onload=()=>{loaded++};i.src=SRC[k];IMG[k]=i}
const P={x:96,y:96,dir:1,moving:false,frame:0,t:0};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function step(){
  let dx=0,dy=0;
  if(keys['arrowleft']||keys['a'])dx=-1; if(keys['arrowright']||keys['d'])dx=1;
  if(keys['arrowup']||keys['w'])dy=-1; if(keys['arrowdown']||keys['s'])dy=1;
  P.moving=!!(dx||dy);
  if(P.moving){P.x=Math.max(0,Math.min(768-56,P.x+dx*2.4));P.y=Math.max(0,Math.min(512-84,P.y+dy*2.4));if(dx)P.dir=dx;P.t++;if(P.t>=3){P.t=0;P.frame=(P.frame+1)%25}}
  requestAnimationFrame(draw);
}
function draw(){
  if(loaded<7){requestAnimationFrame(draw);return}
  for(let r=0;r<8;r++)for(let c=0;c<12;c++){ctx.drawImage(IMG[T[MAP[r][c]]],c*64,r*64,64,64)}
  if(P.moving){
    const f=P.frame,fx=(f%5)*256,fy=Math.floor(f/5)*256;
    ctx.save();ctx.translate(P.x+28,P.y);
    if(P.dir<0){ctx.scale(-1,1);ctx.translate(-56,0)}
    ctx.drawImage(IMG.walk,fx,fy,256,256,0,0,56,84);ctx.restore();
  }else{
    ctx.drawImage(IMG.idle,0,0,IMG.idle.width,IMG.idle.height,P.x+8,P.y,40,84);
  }
  step();
}
draw();
